name: Deploy FE
on:
  push:
    branches: [main]
    paths: ['src/**']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y lftp
      - name: Mirror src/ via SFTP
        env:
          HOST: ${{ secrets.WS_HOST }}
          USER: ${{ secrets.WS_USER }}
          PASS: ${{ secrets.WS_PASS }}
          TARGET: ${{ secrets.WS_PATH }}
        run: |
          lftp -u "$USER,$PASS" "sftp://$HOST:22" -e "
            set sftp:auto-confirm yes;
            set net:max-retries 2;
            mirror -R --delete --verbose ./src/ $TARGET;
            bye"