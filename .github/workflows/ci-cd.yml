name: CI

on:
  push:
    branches: [test]
  pull_request:
    branches: [test]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # No `npm ci` step: the app has zero dependencies, and the checks below
      # run on the Node standard library alone.

      - name: Check required files exist
        run: |
          for f in src/index.html src/main.js src/router.js src/routes.js; do
            [ -f "$f" ] || { echo "Missing: $f"; exit 1; }
          done
          echo "All required files present."

      - name: Check for stray dependencies
        run: |
          node -e "
            const pkg = require('./package.json');
            const deps = { ...pkg.dependencies, ...pkg.devDependencies };
            if (Object.keys(deps).length) {
              console.error('This project must stay dependency-free, found:', Object.keys(deps).join(', '));
              process.exit(1);
            }
            console.log('No dependencies. Good.');
          "

      - name: Syntax, imports and i18n
        run: npm run check

      - name: Build
        run: npm run build
