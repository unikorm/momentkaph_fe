name: CI

on:
  push:
    branches: [test]
  pull_request:
    branches: [test]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JS syntax
        run: find src/js dev.js -name '*.js' -exec node --check {} +
