<head>

  <meta name="keywords"
    content="Profesionálna fotografka Žilina: Fotenie rodín a detí, Novorodenecké fotografie, Tehotenské fotenie, Fotoatelier Žilina, Detská fotografia, Fotenie detí a bábätiek, Rodinný fotograf, Portréty, Svadby, ">
  <meta name="author" content="Anna Lednicka">

  <meta property="og:type" content="website">
  <meta property="og:url" content="https://momentkaph.sk/">
  <meta property="og:title" content="momentka.ph">
  <meta property="og:description"
    content="Fotografka, ktorá zachytí tvoje najkrajšie momenty. Fotenie svadieb, rodín a detí, novorodencov, tehotenské, portréty, atď.">
  <meta property="og:image" content="https://momentkaph.sk/assets/about_photo.avif">
  <meta property="og:image:width" content="800">
  <meta property="og:image:height" content="797">
  <meta property="og:site_name" content="momentka.ph">

  <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/android-chrome-192x192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="assets/android-chrome-512x512.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png">
  <link rel="manifest" href="assets/site.webmanifest">
  <link rel="preload" href="fonts/CaveatReg.woff2" as="font" type="font/woff2" crossorigin="anonymous">

  <link rel="stylesheet" href="styles/global.css">
  <link rel="stylesheet" href="styles/nav.css">
  <link rel="stylesheet" href="styles/contact.css">
  <script type="module" src="js/contact.js"></script>
  <!-- <script type="module" src="js/lang.js"></script> -->
</head>

<body>
  <div class="menu_container">
    <nav>
      <a href="about-me.html" data-i18n="nav.aboutMe">O mne</a>
      <a href="index.html" data-i18n="nav.gallery">Galéria</a>
      <a href="contact-me.html" class="activeLink" data-i18n="nav.contact">Kontakt</a>
    </nav>
  </div>
  <div class="contact_container__content">
    <div class="contact_container__content_title">
      <div class="image_group">
        <div class="contact-image-container">
          <img src="assets/contact_photo.avif" alt="to som ja">
          <span data-i18n="common.thatsMe">to som ja</span>
        </div>
        <div>
          <p data-i18n="contact.contactMe">kontaktuj ma</p>
        </div>
      </div>
    </div>
    <div class="contact_container__content_form">
      <form id="contact-form">
        <div class="box">
          <input id="name" name="name" type="text" required minlength="3" maxlength="100" placeholder="Tvoje meno"
            data-i18n-ph="contact.form.name.placeholder">
        </div>
        <div class="box">
          <input id="email" name="email" type="email" required placeholder="Tvoj email"
            data-i18n-ph="contact.form.email.placeholder">
        </div>
        <div class="box">
          <input id="phone" name="phone" type="tel" required pattern="\+?[0-9\s\-]{10,}" placeholder="Tvoje tel. číslo"
            data-i18n-ph="contact.form.phone.placeholder">
        </div>
        <div class="box">
          <textarea id="message" name="message" rows="3" required minlength="20" maxlength="700"
            placeholder="Správa pre mňa..." data-i18n-ph="contact.form.message.placeholder"></textarea>
        </div>
        <button type="submit" data-i18n="contact.form.button.idle">Odoslať správu</button>
      </form>
      <p class="or" data-i18n="contact.or">ALEBO</p>
      <div class="social_network">
        <div><a href="https://www.instagram.com/momentka.ph/" target="_blank" rel="noopener"><img
              src="assets/instagram.svg" alt="Instagram"></a></div>
        <div><a href="https://m.me/" target="_blank" rel="noopener"><img src="assets/messenger.svg" alt="Messenger"></a>
        </div>
        <div><a href="https://wa.me/421951775896" target="_blank" rel="noopener"><img src="assets/whatsapp.svg"
              alt="WhatsApp"></a></div>
      </div>
    </div>
  </div>
</body>

</html>
