# ============================================================
# momentkaph.sk — STATIC FRONTEND
# ============================================================
#
# DRAFT — written by hand, not yet run against a live nginx.
# Always `nginx -t` before reloading.
#
# Mirrors src/js/routes.js: when a route is added there, add it here.
# Routing model: DEFAULT DENY, same as apis.conf. Only enumerated URL
# shapes get a 200; everything else is a 404 served with 404.html.
#
# URL RULES
#   /                     index.html
#   /about-me             about-me.html        no .html in the address bar
#   /contact-me           contact-me.html
#   /gallery/weddings     gallery.html         page reads the type from the path
#   /gallery/babies/…     gallery.html
#   /gallery              301 → /
#   /gallery/babies       301 → /gallery/babies/baptism
#   /about-me.html        301 → /about-me      one canonical address per page
#   /about-me/            301 → /about-me      no trailing slash
#   /sk/…                 301 → /…             default language is unprefixed
#   /en/…  /uk/…          same files, prefix stays in the address bar
#                         (js/lang.js reads it from location.pathname)
#   /404, anything else   404 + 404.html
#
# LAYOUT
#   root = the contents of src/  (index.html, about-me.html, assets/, …)
#
# TODO before going live: security headers (NOT snippets/security-headers.conf,
# its CSP is for JSON responses), gzip for html/css/js/json, Cache-Control on
# assets, certificate that also covers www.
# ============================================================

# Language prefix of the ORIGINAL request: "" | "/en" | "/uk".
# $request_uri, not $uri — the rewrite in the server block strips the
# prefix from $uri, and map values are evaluated lazily.
map $request_uri $lang {
    default                     "";
    "~^/(?<l>en|uk)(/|\?|$)"    "/$l";
}

# Home page for the current language: "/" | "/en" | "/uk".
map $request_uri $home {
    default                     "/";
    "~^/(?<l>en|uk)(/|\?|$)"    "/$l";
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name momentkaph.sk;

    root /var/www/momentkaph;

    ssl_certificate     /etc/letsencrypt/live/momentkaph.sk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/momentkaph.sk/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    error_page 404 /404.html;

    # ---- 1. one address per page (301) ---------------------------------
    rewrite ^/sk/?$          /       permanent;
    rewrite ^/sk/(.*)$       /$1     permanent;
    rewrite ^/(.+)/$         /$1     permanent;      # trailing slash, except "/"

    # ---- 2. language prefix: strip it internally, serve the same files -----
    #         (the browser keeps /en/… in the address bar; $lang remembers it)
    rewrite ^/(en|uk)$       /       last;
    rewrite ^/(en|uk)/(.*)$  /$2     last;

    # ---- 3. pages --------------------------------------------------------
    location = /            { try_files /index.html      =404; }
    location = /about-me    { try_files /about-me.html   =404; }
    location = /contact-me  { try_files /contact-me.html =404; }

    location ~ ^/gallery/(weddings|love-story|pregnancy|studio|family|portrait)$ {
        try_files /gallery.html =404;
    }
    location ~ ^/gallery/babies/(baptism|newborn)$ {
        try_files /gallery.html =404;
    }

    location = /gallery        { return 301 $home; }
    location = /gallery/babies { return 301 $lang/gallery/babies/baptism; }

    # .html is an implementation detail, never an address
    location = /index.html      { return 301 $home; }
    location = /gallery.html    { return 301 $home; }
    location = /about-me.html   { return 301 $lang/about-me; }
    location = /contact-me.html { return 301 $lang/contact-me; }

    # a real 404 status; the page itself is reachable only through error_page
    location = /404      { return 404; }
    location = /404.html { internal; }

    # ---- 4. static files -------------------------------------------------
    location ~ ^/(assets|styles|js|fonts|lang)/ {
        try_files $uri =404;
    }

    # ---- 5. everything else ----------------------------------------------
    location / { return 404; }
}

# www → apex (needs a certificate that covers www.momentkaph.sk)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.momentkaph.sk;

    ssl_certificate     /etc/letsencrypt/live/momentkaph.sk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/momentkaph.sk/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    return 301 https://momentkaph.sk$request_uri;
}

# http → https, keep HTTP-01 renewal working
server {
    listen 80;
    listen [::]:80;
    server_name momentkaph.sk www.momentkaph.sk;

    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://momentkaph.sk$request_uri; }
}
